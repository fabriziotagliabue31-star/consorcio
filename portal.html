<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERTAG — Portal de propietarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.25/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#F2F8FC; --card:#FFFFFF; --tile:#E7F2FB;
    --text:#1D2B36; --text2:#5C7182; --muted:#8FA3B3;
    --border:#DCEAF6;
    --accent:#0B6FB0; --accent-bg:#E1F0FB;
    --danger:#A32D2D; --danger-bg:#FCEBEB;
    --success:#3B6D11; --success-bg:#EAF3DE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);}
  input,select,button{font-family:inherit;font-size:14px;padding:0.55rem 0.75rem;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);}
  button{cursor:pointer;font-weight:500;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button:hover{opacity:0.9;}
  h1{font-size:19px;font-weight:600;margin:0;}
  h2{font-size:15px;font-weight:600;margin:0 0 12px;}
  .hidden{display:none !important;}
  .error{color:var(--danger);font-size:13px;margin-top:8px;}
  .muted-note{color:var(--muted);font-size:13px;}

  .login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(180deg, #EAF5FC 0%, #D3EAFA 100%);}
  .login-skyline{position:absolute;bottom:0;left:0;width:100%;height:42%;opacity:0.9;}
  .login-brand{position:relative;z-index:1;text-align:center;margin-bottom:1.5rem;}
  .login-brand .wordmark{font-size:30px;font-weight:700;color:var(--accent);letter-spacing:0.5px;}
  .login-brand .tagline{font-size:13px;color:var(--text2);margin-top:2px;}
  .login-card{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem;width:100%;max-width:340px;}
  .login-card input{width:100%;margin:6px 0 14px;}

  .wrap{max-width:720px;margin:0 auto;padding:2rem 1.25rem 3rem;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.75rem;flex-wrap:wrap;gap:10px;}
  .brand-mini{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);font-size:16px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem;}
  .kpi{background:var(--tile);border-radius:10px;padding:1rem;}
  .kpi p{margin:0;}
  .kpi .label{font-size:13px;color:var(--text2);margin-bottom:4px;}
  .kpi .value{font-size:22px;font-weight:600;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.25rem 1.25rem 1.25rem;margin-bottom:1.25rem;}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding-top:1.1rem;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}

  .badge{font-size:12px;padding:3px 10px;border-radius:100px;font-weight:500;white-space:nowrap;}
  .badge.ok{background:var(--success-bg);color:var(--success);}
  .badge.debe{background:var(--danger-bg);color:var(--danger);}
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <svg class="login-skyline" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0" y="180" width="80" height="100" fill="#CFE6F8"/>
    <rect x="90" y="130" width="60" height="150" fill="#B7D9F2"/>
    <rect x="160" y="160" width="100" height="120" fill="#CFE6F8"/>
    <rect x="270" y="90" width="70" height="190" fill="#9DCBEE"/>
    <rect x="350" y="150" width="90" height="130" fill="#B7D9F2"/>
    <rect x="450" y="110" width="60" height="170" fill="#CFE6F8"/>
    <rect x="520" y="60" width="80" height="220" fill="#7FBBE8"/>
    <rect x="610" y="140" width="100" height="140" fill="#B7D9F2"/>
    <rect x="720" y="100" width="70" height="180" fill="#9DCBEE"/>
    <rect x="800" y="170" width="90" height="110" fill="#CFE6F8"/>
    <rect x="900" y="120" width="60" height="160" fill="#B7D9F2"/>
    <rect x="970" y="80" width="80" height="200" fill="#7FBBE8"/>
    <rect x="1060" y="150" width="70" height="130" fill="#CFE6F8"/>
    <rect x="1140" y="110" width="60" height="170" fill="#9DCBEE"/>
  </svg>
  <div class="login-brand">
    <div class="wordmark">VERTAG</div>
    <div class="tagline">Portal de propietarios</div>
  </div>
  <div class="login-card">
    <h1 style="margin-bottom:1.25rem;">Iniciar sesión</h1>
    <label style="font-size:13px;color:var(--text2);">Email</label>
    <input type="email" id="login-email" />
    <label style="font-size:13px;color:var(--text2);">Contraseña</label>
    <input type="password" id="login-password" />
    <button class="primary" style="width:100%;" onclick="iniciarSesion()">Ingresar</button>
    <p class="error hidden" id="login-error"></p>
  </div>
</div>

<div id="app-screen" class="hidden">
  <div class="wrap">
    <div class="topbar">
      <div class="brand-mini">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v16"/><path d="M13 21V9a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v12"/></svg>
        VERTAG
      </div>
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <div id="selector-unidad-wrap" class="hidden card">
      <div class="card-head"><h2>Tus unidades</h2></div>
      <select id="unidad-select" onchange="cambiarUnidad()"></select>
    </div>

    <div class="topbar" style="margin-bottom:1rem;">
      <div>
        <p style="margin:0;font-size:16px;font-weight:600;" id="nombre-consorcio">—</p>
        <p style="margin:0;font-size:13px;color:var(--text2);" id="direccion-consorcio"></p>
      </div>
      <span class="badge ok" id="badge-unidad">—</span>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><p class="label">Estado de cuenta</p><p class="value" id="kpi-saldo">-</p></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Liquidaciones</h2></div>
      <div id="liq-lista"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Pagos registrados</h2></div>
      <div id="pagos-lista"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://sqafmrcoshkxbtledyij.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r_b6XWYYo-v_03RjcvJA6w_0QKHIvD6';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let misUnidades = [];
let unidadActual = null;

async function iniciarSesion() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.classList.add('hidden');

  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) { errorEl.textContent = error.message; errorEl.classList.remove('hidden'); return; }
  await mostrarApp();
}

async function cerrarSesion() {
  await client.auth.signOut();
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

async function verificarSesionExistente() {
  const { data } = await client.auth.getSession();
  if (data.session) await mostrarApp();
}

async function mostrarApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');

  const { data, error } = await client
    .from('titulares')
    .select('unidad_funcional_id, unidades_funcionales(identificador, consorcio_id, consorcios(nombre, direccion))');
  if (error) { alert('Error cargando tus unidades: ' + error.message); return; }

  misUnidades = data;

  if (misUnidades.length === 0) {
    document.getElementById('nombre-consorcio').textContent = 'Tu cuenta todavía no está vinculada a ninguna unidad';
    return;
  }

  if (misUnidades.length > 1) {
    document.getElementById('selector-unidad-wrap').classList.remove('hidden');
    document.getElementById('unidad-select').innerHTML = misUnidades.map((u, i) =>
      `<option value="${i}">${u.unidades_funcionales.identificador} — ${u.unidades_funcionales.consorcios.nombre}</option>`
    ).join('');
  }

  unidadActual = misUnidades[0];
  await cargarUnidad();
}

async function cambiarUnidad() {
  const idx = parseInt(document.getElementById('unidad-select').value, 10);
  unidadActual = misUnidades[idx];
  await cargarUnidad();
}

async function cargarUnidad() {
  const unidadId = unidadActual.unidad_funcional_id;
  const uf = unidadActual.unidades_funcionales;

  document.getElementById('nombre-consorcio').textContent = uf.consorcios.nombre;
  document.getElementById('direccion-consorcio').textContent = uf.consorcios.direccion || '';
  document.getElementById('badge-unidad').textContent = uf.identificador;

  const { data: saldoRows, error: e1 } = await client
    .from('v_saldo_cuenta_corriente')
    .select('saldo')
    .eq('unidad_funcional_id', unidadId);
  if (e1) { alert('Error cargando el saldo: ' + e1.message); return; }

  const saldo = saldoRows[0]?.saldo || 0;
  const kpiEl = document.getElementById('kpi-saldo');
  if (saldo > 0) {
    kpiEl.textContent = 'Debe $' + Number(saldo).toLocaleString('es-AR');
    kpiEl.style.color = 'var(--danger)';
  } else {
    kpiEl.textContent = 'Al día';
    kpiEl.style.color = 'var(--success)';
  }

  const { data: liquidaciones, error: e2 } = await client
    .from('liquidaciones')
    .select('id, monto_total, periodos_liquidacion(mes, anio)')
    .eq('unidad_funcional_id', unidadId)
    .order('fecha_generacion', { ascending: false });
  if (e2) { alert('Error cargando liquidaciones: ' + e2.message); return; }

  document.getElementById('liq-lista').innerHTML = liquidaciones.map(l => `
    <div class="row">
      <span>${l.periodos_liquidacion.mes}/${l.periodos_liquidacion.anio}</span>
      <span>$${Number(l.monto_total).toLocaleString('es-AR')} <button onclick="descargarPdfLiquidacion('${l.id}')">PDF</button></span>
    </div>
  `).join('') || '<p class="muted-note">Todavía no hay liquidaciones generadas.</p>';

  const { data: pagos, error: e3 } = await client
    .from('pagos')
    .select('monto, fecha_pago, metodo_pago')
    .eq('unidad_funcional_id', unidadId)
    .order('fecha_pago', { ascending: false })
    .limit(10);
  if (e3) { alert('Error cargando pagos: ' + e3.message); return; }

  document.getElementById('pagos-lista').innerHTML = pagos.map(p => `
    <div class="row">
      <span>${p.fecha_pago} · ${p.metodo_pago || ''}</span>
      <span>$${Number(p.monto).toLocaleString('es-AR')}</span>
    </div>
  `).join('') || '<p class="muted-note">Todavía no registraste pagos.</p>';
}

async function descargarPdfLiquidacion(liquidacionId) {
  try {
    const { data: liq, error: e1 } = await client
      .from('liquidaciones')
      .select('id, monto_total, unidad_funcional_id, periodo_id')
      .eq('id', liquidacionId)
      .single();
    if (e1) throw e1;

    const [ru, rp, rc, rd] = await Promise.all([
      client.from('unidades_funcionales').select('identificador').eq('id', liq.unidad_funcional_id).single(),
      client.from('periodos_liquidacion').select('mes, anio').eq('id', liq.periodo_id).single(),
      client.from('consorcios').select('nombre, direccion').eq('id', unidadActual.unidades_funcionales.consorcio_id).single(),
      client.from('detalle_liquidacion')
        .select('monto_prorrateado, categorias_gasto(nombre), gastos(descripcion)')
        .eq('liquidacion_id', liquidacionId),
    ]);
    if (ru.error) throw ru.error;
    if (rp.error) throw rp.error;
    if (rc.error) throw rc.error;
    if (rd.error) throw rd.error;

    const unidad = ru.data, periodo = rp.data, consorcio = rc.data, detalle = rd.data;

    if (!window.jspdf || !window.jspdf.jsPDF) {
      alert('No se pudo cargar la libreria de PDF. Revisa tu conexion a internet y recarga la pagina.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(14);
    doc.text(consorcio.nombre, 14, 18);
    if (consorcio.direccion) {
      doc.setFontSize(10);
      doc.setTextColor(120);
      doc.text(consorcio.direccion, 14, 24);
    }

    doc.setFontSize(12);
    doc.setTextColor(0);
    doc.text(`Liquidacion de expensas - ${periodo.mes}/${periodo.anio}`, 14, 34);
    doc.setFontSize(10);
    doc.text(`Unidad: ${unidad.identificador}`, 14, 41);

    if (typeof doc.autoTable !== 'function') {
      alert('No se pudo cargar el plugin de tablas del PDF. Revisa tu conexion a internet y recarga la pagina.');
      return;
    }

    doc.autoTable({
      startY: 48,
      head: [['Categoria', 'Descripcion', 'Monto']],
      body: detalle.map(d => [
        d.categorias_gasto?.nombre || '',
        d.gastos?.descripcion || '',
        '$' + Number(d.monto_prorrateado).toLocaleString('es-AR'),
      ]),
      foot: [['', 'Total', '$' + Number(liq.monto_total).toLocaleString('es-AR')]],
      styles: { fontSize: 9 },
      headStyles: { fillColor: [11, 111, 176] },
      footStyles: { fillColor: [231, 242, 251], textColor: [29, 43, 54] },
    });

    doc.save(`liquidacion_${unidad.identificador}_${periodo.mes}-${periodo.anio}.pdf`);
  } catch (err) {
    console.error(err);
    alert('Error generando el PDF: ' + (err?.message || JSON.stringify(err)));
  }
}

verificarSesionExistente();
</script>
</body>
</html>
